    <script>
        let currentSlide = 0;
        const totalSlides = 15;
        let showDeepNotes = true;

        // Estado interactivo de cada laboratorio de la Clase 3
        const state = {
            slide2A: 50,
            slide2B: 60,
            slide3Sides: 3, // 3=Triángulo, 4=Cuadrilátero, 5=Pentágono, etc.
            slide4Tab: 'complementarios',
            slide4CompA: 30,
            slide4SupA: 110,
            slide5A: 6,
            slide5B: 8,
            slide5Mode: 'hipotenusa', // 'hipotenusa' o 'cateto'
            slide6X1: 1,
            slide6Y1: 2,
            slide6X2: 4,
            slide6Y2: 6,
            slide7Tab: 'soh', // 'soh', 'cah', 'toa'
            slide8Ladder: 10,
            slide8Angle: 30,
            slide9SelectedAngle: 45, // 30, 45, 60
            slide10A1: 3,
            slide10D: 4,
            slide10N: 10,
            slide11N: 100,
            slide12K: 4,
            slide13Fixed: { 0: false, 1: false, 2: false, 3: false },
            slide14Pillar: 'triangulos',
            slide15AngleA: 35
        };

        // Las 15 diapositivas exactas del archivo Clase3_Geometria_trigonometria_y_patrones.pptx
        const slidesMeta = [
            { num: 1, title: "Geometría, trigonometría y patrones", subtitle: "Clase 3 · Bloque 1 · Triángulos, Pitágoras, distancia, SOH-CAH-TOA y secuencias", icon: "fa-draw-polygon" },
            { num: 2, title: "Los ángulos de un triángulo suman 180°", subtitle: "Si juntas sus esquinas, forman una línea recta", icon: "fa-play" },
            { num: 3, title: "Suma de ángulos en polígonos", subtitle: "Fórmula: (n − 2) · 180°, donde n es el número de lados", icon: "fa-shapes" },
            { num: 4, title: "Ángulos complementarios y suplementarios", subtitle: "Dos ángulos que suman un valor fijo (90° o 180°)", icon: "fa-compass" },
            { num: 5, title: "Teorema de Pitágoras", subtitle: "En un triángulo rectángulo: a² + b² = c²", icon: "fa-ruler-combined" },
            { num: 6, title: "Distancia entre dos puntos", subtitle: "Pitágoras aplicado a las diferencias en x y en y", icon: "fa-location-dot" },
            { num: 7, title: "Razones trigonométricas", subtitle: "SOH - CAH - TOA", icon: "fa-percent" },
            { num: 8, title: "Ejemplo: altura de una escalera", subtitle: "Escalera de 10 m formando 30° con el suelo", icon: "fa-stairs" },
            { num: 9, title: "Valores que conviene memorizar", subtitle: "Ángulos notables: 30°, 45° y 60°", icon: "fa-table" },
            { num: 10, title: "Patrones: progresión aritmética", subtitle: "3, 7, 11, 15, 19: cada término suma 4", icon: "fa-arrow-trend-up" },
            { num: 11, title: "Suma de 1 a n: idea de Gauss", subtitle: "Las parejas que suman lo mismo: n · (n + 1) ÷ 2", icon: "fa-plus-minus" },
            { num: 12, title: "Suma de impares: n²", subtitle: "1 + 3 + 5 + … + (2n − 1) = n²", icon: "fa-border-all" },
            { num: 13, title: "Errores frecuentes", subtitle: "Revísalos antes del examen", icon: "fa-triangle-exclamation" },
            { num: 14, title: "Resumen de la clase", subtitle: "Triángulos, Pitágoras, Trigonometría y Patrones", icon: "fa-cubes" },
            { num: 15, title: "Si un ángulo agudo mide 35°", subtitle: "¿Cuánto mide el otro ángulo agudo de un triángulo rectángulo?", icon: "fa-lightbulb" }
        ];

        // Componente reutilizable para el apartado "Para saber más..."
        function renderDeepExplanation(title, mathExplanation, cppConnection) {
            if (!showDeepNotes) return '';
            return `
                <div class="mt-4 p-4 sm:p-5 rounded-2xl bg-amber-50/70 border border-amber-200/80 text-slate-700 shadow-sm transition-all">
                    <div class="flex items-center gap-2 text-amber-800 font-bold text-xs sm:text-sm tracking-wide mb-2">
                        <i class="fa-solid fa-graduation-cap text-amber-600 text-base"></i>
                        <span>Para saber más... · ${title}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs sm:text-sm leading-relaxed">
                        <div class="bg-white/80 p-3.5 rounded-xl border border-amber-100">
                            <span class="font-bold text-slate-800 block mb-1"><i class="fa-solid fa-square-root-variable text-indigo-600 mr-1.5"></i>¿Por qué funciona así en Matemáticas?</span>
                            <p class="text-slate-600">${mathExplanation}</p>
                        </div>
                        <div class="bg-white/80 p-3.5 rounded-xl border border-amber-100">
                            <span class="font-bold text-slate-800 block mb-1"><i class="fa-solid fa-terminal text-teal-600 mr-1.5"></i>Conexión con Programación Competitiva (C++)</span>
                            <p class="text-slate-600">${cppConnection}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSlideContent(index) {
            switch (index) {
                // DIAPOSITIVA 1: Portada
                case 0:
                    return `
                        <div class="slide-enter flex-1 flex flex-col items-center justify-center text-center py-4">
                            <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl bg-gradient-to-br from-indigo-100 via-sky-50 to-teal-100 border border-indigo-200 flex items-center justify-center mb-5 shadow-md shadow-indigo-100">
                                <i class="fa-solid fa-draw-polygon text-4xl sm:text-5xl text-indigo-700"></i>
                            </div>
                            <span class="px-3.5 py-1 rounded-full text-xs font-mono uppercase tracking-widest bg-indigo-50 text-indigo-700 border border-indigo-200 mb-3 font-semibold">
                                Club de programación Competitiva - BugSquad 2026
                            </span>
                            <h1 class="text-3xl sm:text-5xl md:text-6xl font-extrabold tracking-tight text-slate-800 mb-3">
                                Geometría, trigonometría y patrones
                            </h1>
                            <p class="text-base sm:text-xl text-slate-600 max-w-3xl font-medium mb-6">
                                Clase 3 · Bloque 1 · Triángulos, Pitágoras, distancia, SOH-CAH-TOA y secuencias
                            </p>

                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full max-w-3xl mb-6 text-left">
                                <button onclick="goToSlide(1)" class="p-3.5 rounded-2xl bg-indigo-50/70 hover:bg-indigo-100/80 border border-indigo-200/80 flex flex-col gap-1.5 transition">
                                    <div class="flex items-center justify-between">
                                        <i class="fa-solid fa-shapes text-indigo-600 text-lg"></i>
                                        <span class="text-[11px] font-mono text-indigo-700">Diap. 2-4</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-800">Ángulos y Polígonos</span>
                                    <span class="text-[11px] text-slate-500">180°, (n−2)·180°, 90° y 180°</span>
                                </button>
                                <button onclick="goToSlide(4)" class="p-3.5 rounded-2xl bg-sky-50/70 hover:bg-sky-100/80 border border-sky-200/80 flex flex-col gap-1.5 transition">
                                    <div class="flex items-center justify-between">
                                        <i class="fa-solid fa-ruler-combined text-sky-600 text-lg"></i>
                                        <span class="text-[11px] font-mono text-sky-700">Diap. 5-6</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-800">Pitágoras y Distancia</span>
                                    <span class="text-[11px] text-slate-500">a² + b² = c² y plano cartesiano</span>
                                </button>
                                <button onclick="goToSlide(6)" class="p-3.5 rounded-2xl bg-teal-50/70 hover:bg-teal-100/80 border border-teal-200/80 flex flex-col gap-1.5 transition">
                                    <div class="flex items-center justify-between">
                                        <i class="fa-solid fa-compass-drafting text-teal-600 text-lg"></i>
                                        <span class="text-[11px] font-mono text-teal-700">Diap. 7-9</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-800">Trigonometría</span>
                                    <span class="text-[11px] text-slate-500">SOH-CAH-TOA y ángulos 30°, 45°, 60°</span>
                                </button>
                                <button onclick="goToSlide(9)" class="p-3.5 rounded-2xl bg-purple-50/70 hover:bg-purple-100/80 border border-purple-200/80 flex flex-col gap-1.5 transition">
                                    <div class="flex items-center justify-between">
                                        <i class="fa-solid fa-arrow-trend-up text-purple-600 text-lg"></i>
                                        <span class="text-[11px] font-mono text-purple-700">Diap. 10-15</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-800">Patrones y Sumas</span>
                                    <span class="text-[11px] text-slate-500">Progresiones, Gauss y suma n²</span>
                                </button>
                            </div>

                            ${renderDeepExplanation(
                                'Propósito de la Clase 3',
                                'La geometría y la trigonometría nos permiten medir distancias y alturas en el plano, mientras que el reconocimiento de patrones convierte sumas de millones de términos en fórmulas directas.',
                                'En programación competitiva, usar la fórmula de Gauss <span class="font-mono">n * (n + 1) / 2</span> o trabajar con distancias al cuadrado (<span class="font-mono">dx*dx + dy*dy</span>) es la diferencia entre un programa que tarda segundos y uno instantáneo en <span class="font-mono">O(1)</span>.'
                            )}
                        </div>
                    `;

                // DIAPOSITIVA 2: Los ángulos de un triángulo suman 180°
                case 1: {
                    const a = state.slide2A;
                    const b = state.slide2B;
                    const c = 180 - a - b;
                    return `
                        <div class="slide-enter flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="px-2.5 py-1 rounded-lg bg-indigo-100 text-indigo-800 font-mono text-xs font-bold">Diapositiva 2 de 15</span>
                                    <span class="text-xs text-slate-500 font-medium">Propiedad Fundamental de todo Triángulo</span>
                                </div>
                                <h2 class="text-2xl sm:text-4xl font-extrabold text-slate-800">Los ángulos de un triángulo suman 180°</h2>
                                <p class="text-slate-600 text-base sm:text-lg mt-1">Si juntas sus esquinas, forman una línea recta</p>
                            </div>

                            <!-- Tarjetas de los 3 ángulos + Barra visual de 180° -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 my-4">
                                <div class="p-5 rounded-2xl bg-sky-50/90 border-2 border-sky-200 flex flex-col items-center text-center shadow-sm">
                                    <span class="text-xs font-mono uppercase text-sky-700 font-bold mb-1">Esquina 1</span>
                                    <div class="text-4xl font-mono font-extrabold text-sky-800">${a}°</div>
                                    <input type="range" min="20" max="80" value="${a}" oninput="state.slide2A = parseInt(this.value); updateView();" class="w-full mt-3 accent-sky-600 cursor-pointer">
                                </div>
                                <div class="p-5 rounded-2xl bg-teal-50/90 border-2 border-teal-200 flex flex-col items-center text-center shadow-sm">
                                    <span class="text-xs font-mono uppercase text-teal-700 font-bold mb-1">Esquina 2</span>
                                    <div class="text-4xl font-mono font-extrabold text-teal-800">${b}°</div>
                                    <input type="range" min="20" max="80" value="${b}" oninput="state.slide2B = parseInt(this.value); updateView();" class="w-full mt-3 accent-teal-600 cursor-pointer">
                                </div>
                                <div class="p-5 rounded-2xl bg-purple-50/90 border-2 border-purple-200 flex flex-col items-center text-center shadow-sm">
                                    <span class="text-xs font-mono uppercase text-purple-700 font-bold mb-1">Esquina 3 (Restante)</span>
                                    <div class="text-4xl font-mono font-extrabold text-purple-800">${c}°</div>
                                    <span class="text-xs font-mono text-purple-700 mt-3">180° − ${a}° − ${b}° = ${c}°</span>
                                </div>
                            </div>

                            <!-- Demostración de la línea recta (180°) -->
                            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col gap-2.5">
                                <div class="flex items-center justify-between text-xs font-mono text-slate-600">
                                    <span>Esquinas juntas sobre una recta (Ángulo llano = 180°):</span>
                                    <button onclick="state.slide2A = 50; state.slide2B = 60; updateView();" class="px-2.5 py-1 rounded-lg bg-white border border-slate-300 text-slate-700 hover:bg-slate-100">
                                        Restaurar 50° + 60° + 70°
                                    </button>
                                </div>
                                <div class="w-full h-7 rounded-xl overflow-hidden flex border border-slate-300 font-mono text-xs font-bold">
                                    <div style="width: ${(a/180)*100}%" class="bg-sky-200 text-sky-900 flex items-center justify-center border-r border-sky-300 transition-all">${a}°</div>
                                    <div style="width: ${(b/180)*100}%" class="bg-teal-200 text-teal-900 flex items-center justify-center border-r border-teal-300 transition-all">${b}°</div>
                                    <div style="width: ${(c/180)*100}%" class="bg-purple-200 text-purple-900 flex items-center justify-center transition-all">${c}°</div>
                                </div>
                                <div class="text-center font-mono text-base sm:text-lg font-extrabold text-slate-800">
                                    <span class="text-sky-700">${a}°</span> + <span class="text-teal-700">${b}°</span> + <span class="text-purple-700">${c}°</span> = <span class="text-emerald-700 underline">180°</span>
                                </div>
                            </div>

                            ${renderDeepExplanation(
                                '¿Por qué los 3 ángulos siempre forman media vuelta (180°)?',
                                'Si trazas una línea paralela a la base por el vértice superior del triángulo, los dos ángulos de la base se reflejan arriba como ángulos alternos internos. Al reunirse con el ángulo superior, los tres encajan exactamente sobre la línea recta (<span class="font-mono">180°</span>).',
                                'Si en un problema conoces dos ángulos de un triángulo (<span class="font-mono">A</span> y <span class="font-mono">B</span>), el tercero se calcula directamente con una resta: <span class="font-mono">int C = 180 - A - B;</span>.'
                            )}

                // DIAPOSITIVA 3: Suma de ángulos en polígonos
                case 2: {
                    const n = state.slide3Sides;
                    const trianglesCount = n - 2;
                    const totalSum = trianglesCount * 180;
                    const polyNames = {
                        3: 'Triángulo',
                        4: 'Cuadrilátero',
                        5: 'Pentágono',
                        6: 'Hexágono',
                        7: 'Heptágono',
                        8: 'Octágono'
                    };
                    return `

        window.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 60) {
                if (diff > 0) nextSlide();
                else prevSlide();
            }
        }, { passive: true });

        window.onload = function () {
            updateView();
        };
    </script>
</body>
</html>
