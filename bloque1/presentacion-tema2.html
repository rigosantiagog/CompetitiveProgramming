<!DOCTYPE html>

    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="../favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],

    <style>
        body {
            background-color: #F4F6F9;
            color: #334155;
            overflow-x: hidden;
        }
        .slide-enter {
            animation: slideFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.995);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 3px;

</head>
<body class="min-h-screen flex flex-col justify-between select-none">

    <!-- Barra de navegación superior -->

            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-teal-100 border border-teal-200 flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-calculator text-teal-700 text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold tracking-tight text-slate-800 text-sm sm:text-base">BugSquad 2026</span>

                    </div>
                    <p class="text-xs text-slate-500 hidden sm:block">Club de Programación Competitiva · Aritmética, conteo y casos</p>
                </div>
            </div>

            <!-- Controles de índice, "Para saber más..." y pantalla completa -->
            <div class="flex items-center gap-2 sm:gap-2.5">
                <button onclick="toggleDeepNotes()" id="btn-deep-toggle" class="px-3 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs sm:text-sm font-medium flex items-center gap-2 border border-amber-200 transition">

                <button onclick="toggleIndexModal()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200/80 text-slate-700 text-xs sm:text-sm font-medium flex items-center gap-2 border border-slate-200 transition">
                    <i class="fa-solid fa-table-cells-large text-teal-600"></i>
                    <span class="hidden md:inline">Índice</span>
                    <span id="slide-counter-badge" class="font-mono text-xs bg-white px-2 py-0.5 rounded-md text-teal-700 border border-slate-200">1 / 15</span>
                </button>
                <button onclick="toggleFullScreen()" title="Pantalla Completa" class="p-2 sm:px-3 sm:py-2 rounded-xl bg-slate-100 hover:bg-slate-200/80 text-slate-700 text-sm border border-slate-200 transition">
                    <i class="fa-solid fa-expand" id="fullscreen-icon"></i>
                </button>
            </div>
        </div>
        <!-- Barra de progreso suave -->
        <div class="w-full h-1.5 bg-slate-100">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-teal-400 via-sky-400 to-indigo-400 transition-all duration-300" style="width: 6.66%"></div>
        </div>
    </header>

    <!-- Escenario principal de la diapositiva -->
    <main class="flex-1 flex items-center justify-center p-3 sm:p-6 md:p-8 relative overflow-y-auto">
        <div class="w-full max-w-5xl bg-white border border-slate-200/90 rounded-3xl shadow-xl shadow-slate-200/60 p-5 sm:p-8 md:p-10 min-h-[600px] flex flex-col justify-between relative overflow-hidden">
            
            <!-- Luces pastel decorativas de fondo -->
            <div class="-top-24 -right-24 w-80 h-80 bg-teal-100/50 rounded-full blur-3xl pointer-events-none absolute"></div>
            <div class="-bottom-24 -left-24 w-80 h-80 bg-sky-100/50 rounded-full blur-3xl pointer-events-none absolute"></div>

            <!-- Contenedor dinámico de la diapositiva activa -->
            <div id="slide-stage" class="flex-1 flex flex-col justify-between z-10">
                <!-- Se inyecta por JS -->
            </div>

            <!-- Pie de diapositiva oficial -->
            <div class="mt-8 pt-4 border-t border-slate-200/80 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-2 z-10">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-code text-teal-600"></i>
                    <span class="font-medium">Club de programación Competitiva - BugSquad 2026</span>
                </div>
                <div class="flex items-center gap-2 font-mono text-[11px] text-slate-500">
                    <span>Usa <kbd class="px-1.5 py-0.5 bg-slate-100 rounded border border-slate-300 text-slate-700">←</kbd> <kbd class="px-1.5 py-0.5 bg-slate-100 rounded border border-slate-300 text-slate-700">→</kbd> o desliza para cambiar de diapositiva</span>

    <!-- Controles inferiores -->
    <footer class="w-full py-3 px-4 bg-white/90 border-t border-slate-200/80 backdrop-blur-md z-20">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
            <button id="btn-prev" onclick="prevSlide()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200/80 disabled:opacity-40 disabled:pointer-events-none text-slate-700 font-medium text-sm flex items-center gap-2 border border-slate-200 transition">
                <i class="fa-solid fa-arrow-left text-slate-500"></i>
                <span>Anterior</span>
            </button>

            <!-- Indicadores rápidos de puntos -->
            <div id="dots-container" class="hidden sm:flex items-center gap-1.5 flex-wrap justify-center">
                <!-- Puntos generados dinámicamente -->
            </div>

            <button id="btn-next" onclick="nextSlide()" class="px-5 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 disabled:opacity-40 disabled:pointer-events-none text-white font-semibold text-sm flex items-center gap-2 shadow-sm shadow-teal-600/20 transition">
                <span>Siguiente</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </footer>

    <!-- Modal de Índice de las 15 Diapositivas -->
    <div id="index-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-4xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <div class="flex items-center gap-2.5">
                    <i class="fa-solid fa-layer-group text-teal-600 text-lg"></i>
                    <h3 class="font-bold text-lg text-slate-800">Índice Completo de la Clase 2 (15 Diapositivas)</h3>
                </div>
                <button onclick="toggleIndexModal()" class="w-8 h-8 rounded-lg bg-slate-200/70 hover:bg-slate-300/70 flex items-center justify-center text-slate-600">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="index-grid" class="p-5 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 bg-white">
                <!-- Tarjetas de diapositivas -->
            </div>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const totalSlides = 15;
        let showDeepNotes = true;

        // Estado interactivo de cada laboratorio de la Clase 2
        const state = {
            slide2Num: 6,
            slide3Items: 17,
            slide3BagSize: 5,
            slide4M: 5,
            slide4N: 14,
            slide5Cookies: 23,
            slide5Bag: 5,
            slide6Students: 47,
            slide6TableCap: 6,
            slide7Buses: 3,
            slide7Trains: 2,
            slide7Selected: 'Autobús 1',
            slide8Starters: 3,
            slide8Mains: 4,
            slide8Desserts: 2,
            slide9Friends: 5,
            slide9ExampleIdx: 0,
            slide10Filter: 'union', // 'pares', 'mult3', 'ambos', 'union'
            slide11Str: 'ABBAB',
            slide11ActiveStep: 5,
            slide12Fixed: { 0: false, 1: false, 2: false, 3: false },
            slide13Pillar: 'paridad',
            slide14ZeroRevealed: true
        };

        // Las 15 diapositivas exactas del archivo Clase2_Aritmetica_conteo_y_casos.pptx
        const slidesMeta = [
            { num: 1, title: "Aritmética, conteo y casos", subtitle: "Clase 2 · Bloque 1 · Paridad, divisiones, conteo y simulación", icon: "fa-calculator" },
            { num: 2, title: "Par o impar: ¿hay parejas?", subtitle: "Si todo se agrupa de dos en dos, el número es par", icon: "fa-user-group" },
            { num: 3, title: "Residuo: lo que sobra", subtitle: "17 % 5 = 2", icon: "fa-percent" },
            { num: 4, title: "Múltiplos en la recta numérica", subtitle: "Los verdes son múltiplos de 5", icon: "fa-ruler-horizontal" },
            { num: 5, title: "División entera: repartir", subtitle: "23 galletas en bolsas de 5", icon: "fa-cookie-bite" },
            { num: 6, title: "Redondeo hacia arriba", subtitle: "47 alumnos en mesas de 6: ¿cuántas mesas?", icon: "fa-arrow-up-9-1" },
            { num: 7, title: "Principio de la suma: \"o\"", subtitle: "Las opciones no se mezclan, así que se suman", icon: "fa-plus" },
            { num: 8, title: "Principio del producto: \"y\"", subtitle: "Cada decisión se combina con cada opción de las otras", icon: "fa-xmark" },
            { num: 9, title: "Cuidado con el orden", subtitle: "Presidente y secretario de 5 amigos", icon: "fa-people-arrows" },
            { num: 10, title: "Razonamiento por casos", subtitle: "Números del 1 al 30 que son pares o múltiplos de 3", icon: "fa-filter" },
            { num: 11, title: "Simular con tabla de seguimiento", subtitle: "Contador en 0. Cada A suma 2 y cada B resta 1", icon: "fa-table-list" },
            { num: 12, title: "Resultado final para ABBAB: 1", subtitle: "Ejecución paso a paso y prueba de cadenas", icon: "fa-play" },
            { num: 13, title: "Errores frecuentes", subtitle: "Revísalos antes del examen", icon: "fa-triangle-exclamation" },
            { num: 14, title: "Resumen de la clase", subtitle: "Paridad, Aritmética, Conteo y Casos", icon: "fa-shuffle" },
            { num: 15, title: "¿Por qué 0 es par?", subtitle: "Pista: al dividir 0 entre 2, ¿qué residuo queda?", icon: "fa-lightbulb" }
        ];

        // Componente reutilizable para el apartado "Para saber más..."
        function renderDeepExplanation(title, mathExplanation, cppConnection) {
            if (!showDeepNotes) return '';
            return `
                <div class="mt-4 p-4 sm:p-5 rounded-2xl bg-amber-50/70 border border-amber-200/80 text-slate-700 shadow-sm transition-all">
                    <div class="flex items-center gap-2 text-amber-800 font-bold text-xs sm:text-sm tracking-wide mb-2">
                        <i class="fa-solid fa-graduation-cap text-amber-600 text-base"></i>
                        <span>Para saber más... · ${title}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs sm:text-sm leading-relaxed">
                        <div class="bg-white/80 p-3.5 rounded-xl border border-amber-100">
                            <span class="font-bold text-slate-800 block mb-1"><i class="fa-solid fa-square-root-variable text-teal-600 mr-1.5"></i>¿Por qué funciona así en Matemáticas?</span>
                            <p class="text-slate-600">${mathExplanation}</p>
                        </div>
                        <div class="bg-white/80 p-3.5 rounded-xl border border-amber-100">
                            <span class="font-bold text-slate-800 block mb-1"><i class="fa-solid fa-terminal text-sky-600 mr-1.5"></i>Conexión con Programación Competitiva (C++)</span>
                            <p class="text-slate-600">${cppConnection}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSlideContent(index) {
            switch (index) {
                // DIAPOSITIVA 1: Portada
                case 0:
                    return `
                        <div class="slide-enter flex-1 flex flex-col items-center justify-center text-center py-4">
                            <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl bg-gradient-to-br from-teal-100 via-sky-50 to-indigo-100 border border-teal-200 flex items-center justify-center mb-5 shadow-md shadow-teal-100">
                                <i class="fa-solid fa-calculator text-4xl sm:text-5xl text-teal-700"></i>
                            </div>
                            <span class="px-3.5 py-1 rounded-full text-xs font-mono uppercase tracking-widest bg-teal-50 text-teal-700 border border-teal-200 mb-3 font-semibold">
                                Club de programación Competitiva - BugSquad 2026
                            </span>
                            <h1 class="text-3xl sm:text-6xl font-extrabold tracking-tight text-slate-800 mb-3">
                                Aritmética, conteo y casos
                            </h1>
                            <p class="text-base sm:text-xl text-slate-600 max-w-2xl font-medium mb-6">
                                Clase 2 · Bloque 1 · Paridad, divisiones, conteo y simulación
                            </p>

                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full max-w-3xl mb-6 text-left">
                                <button onclick="goToSlide(1)" class="p-3.5 rounded-2xl bg-teal-50/70 hover:bg-teal-100/80 border border-teal-200/80 flex flex-col gap-1.5 transition">
                                    <div class="flex items-center justify-between">
                                        <i class="fa-solid fa-shuffle text-teal-600 text-lg"></i>
                                        <span class="text-[11px] font-mono text-teal-700">Diap. 2-4</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-800">Paridad y Múltiplos</span>
                                    <span class="text-[11px] text-slate-500">Parejas, residuo (%) y recta numérica</span>
                                </button>
                                <button onclick="goToSlide(4)" class="p-3.5 rounded-2xl bg-sky-50/70 hover:bg-sky-100/80 border border-sky-200/80 flex flex-col gap-1.5 transition">
                                    <div class="flex items-center justify-between">
                                        <i class="fa-solid fa-divide text-sky-600 text-lg"></i>
                                        <span class="text-[11px] font-mono text-sky-700">Diap. 5-6</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-800">División y Techo</span>
                                    <span class="text-[11px] text-slate-500">Cociente entero y redondeo hacia arriba</span>
                                </button>
                                <button onclick="goToSlide(6)" class="p-3.5 rounded-2xl bg-purple-50/70 hover:bg-purple-100/80 border border-purple-200/80 flex flex-col gap-1.5 transition">
                                    <div class="flex items-center justify-between">
                                        <i class="fa-solid fa-arrow-up-1-9 text-purple-600 text-lg"></i>
                                        <span class="text-[11px] font-mono text-purple-700">Diap. 7-9</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-800">Técnicas de Conteo</span>
                                    <span class="text-[11px] text-slate-500">Suma ("o"), producto ("y") y orden</span>
                                </button>
                                <button onclick="goToSlide(9)" class="p-3.5 rounded-2xl bg-amber-50/70 hover:bg-amber-100/80 border border-amber-200/80 flex flex-col gap-1.5 transition">
                                    <div class="flex items-center justify-between">
                                        <i class="fa-solid fa-filter text-amber-600 text-lg"></i>
                                        <span class="text-[11px] font-mono text-amber-700">Diap. 10-15</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-800">Casos y Simulación</span>
                                    <span class="text-[11px] text-slate-500">Inclusión-exclusión y tabla de rastreo</span>
                                </button>
                            </div>

                            ${renderDeepExplanation(
                                'Objetivos de la Clase 2',
                                'La aritmética entera y la combinatoria elemental nos permiten responder "¿cuántos grupos se forman?" o "¿de cuántas maneras ocurre un evento?" usando fórmulas exactas en vez de contar de uno en uno.',
                                'En programación competitiva, dominar el operador módulo (%), la división entera (/), el redondeo hacia arriba y las tablas de seguimiento (trace tables) evita errores de precisión y desbordamiento.'
                            )}
                        </div>
                    `;

                // DIAPOSITIVA 2: Par o impar: ¿hay parejas?
                case 1: {
                    const n = state.slide2Num;
                    const pairs = Math.floor(n / 2);
                    const rem = n % 2;
                    return `
                        <div class="slide-enter flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="px-2.5 py-1 rounded-lg bg-teal-100 text-teal-800 font-mono text-xs font-bold">Diapositiva 2 de 15</span>
                                    <span class="text-xs text-slate-500 font-medium">Concepto de Paridad</span>
                                </div>
                                <h2 class="text-2xl sm:text-4xl font-extrabold text-slate-800">Par o impar: ¿hay parejas?</h2>
                                <p class="text-slate-600 text-base sm:text-lg mt-1">Si todo se agrupa de dos en dos, el número es par</p>
                            </div>

                            <!-- Las 2 tarjetas principales del PPTX -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 my-4">
                                <!-- 6 -> PAR -->
                                <div onclick="state.slide2Num = 6; updateView();" class="cursor-pointer p-5 rounded-2xl bg-emerald-50/90 border-2 ${n === 6 ? 'border-emerald-400 ring-2 ring-emerald-200' : 'border-emerald-200'} flex flex-col justify-between shadow-sm transition">
                                    <div class="flex items-center justify-between mb-3">
                                        <span class="text-2xl sm:text-3xl font-mono font-extrabold text-emerald-800">6 → PAR</span>
                                        <span class="text-xs font-mono px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-bold border border-emerald-200">Sobran: 0</span>
                                    </div>
                                    <div class="flex items-center justify-center gap-4 my-3">
                                        ${[1, 2, 3].map(p => `
                                            <div class="px-3.5 py-2.5 rounded-xl bg-white border-2 border-emerald-300 flex items-center gap-2 shadow-sm">
                                                <span class="w-4 h-4 rounded-full bg-emerald-500 inline-block"></span>
                                                <span class="w-4 h-4 rounded-full bg-emerald-500 inline-block"></span>
                                            </div>
                                        `).join('')}
                                    </div>
                                    <p class="text-sm font-semibold text-emerald-900 text-center">Tres parejas completas</p>
                                </div>

                                <!-- 5 -> IMPAR -->
                                <div onclick="state.slide2Num = 5; updateView();" class="cursor-pointer p-5 rounded-2xl bg-amber-50/90 border-2 ${n === 5 ? 'border-amber-400 ring-2 ring-amber-200' : 'border-amber-200'} flex flex-col justify-between shadow-sm transition">
                                    <div class="flex items-center justify-between mb-3">
                                        <span class="text-2xl sm:text-3xl font-mono font-extrabold text-amber-800">5 → IMPAR</span>
                                        <span class="text-xs font-mono px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-bold border border-amber-200">Sobra: 1</span>
                                    </div>
                                    <div class="flex items-center justify-center gap-4 my-3">
                                        ${[1, 2].map(p => `
                                            <div class="px-3.5 py-2.5 rounded-xl bg-white border-2 border-amber-300 flex items-center gap-2 shadow-sm">
                                                <span class="w-4 h-4 rounded-full bg-amber-500 inline-block"></span>
                                                <span class="w-4 h-4 rounded-full bg-amber-500 inline-block"></span>
                                            </div>
                                        `).join('')}
                                        <div class="px-3 py-2.5 rounded-xl bg-rose-50 border-2 border-dashed border-rose-300 flex items-center justify-center">
                                            <span class="w-4 h-4 rounded-full bg-rose-500 inline-block"></span>
                                        </div>
                                    </div>
                                    <p class="text-sm font-semibold text-amber-900 text-center">Dos parejas y una sobra</p>
                                </div>
                            </div>

                            <!-- Simulador interactivo de parejas para cualquier número -->
                            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col gap-3">
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                    <div class="text-sm text-slate-700">
                                        <span class="font-bold text-slate-900">Probador en vivo con N = ${n}:</span>
                                        <span class="font-mono font-bold ml-1 px-2 py-0.5 rounded ${rem === 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                            ${n} → ${rem === 0 ? 'PAR' : 'IMPAR'} (${pairs} pareja${pairs === 1 ? '' : 's'}${rem ? ' y 1 suelta' : ' completas'})
                                        </span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <input type="range" min="0" max="12" value="${n}" oninput="state.slide2Num = parseInt(this.value); updateView();" class="w-36 accent-teal-600 cursor-pointer">
                                        <span class="font-mono text-xs font-bold text-teal-700">N = ${n}</span>
                                    </div>
                                </div>
                            </div>

                            ${renderDeepExplanation(
                                'Representación Algebraica de Par e Impar',
                                'Un número entero es <strong>par</strong> si puede escribirse como <span class="font-mono">2k</span> (múltiplo exacto de 2, residuo 0), y es <strong>impar</strong> si se escribe como <span class="font-mono">2k + 1</span> (al agrupar de 2 en 2 siempre sobra 1).',
                                'En C++ verificamos si un número positivo <span class="font-mono">n</span> es par con la condición <span class="font-mono">if (n % 2 == 0)</span>, y si es impar con <span class="font-mono">if (n % 2 != 0)</span>.'
                            )}
                        </div>
                    `;
                }

                // DIAPOSITIVA 3: Residuo: lo que sobra
                case 2: {
                    const total = state.slide3Items;
                    const bagSize = state.slide3BagSize;
                    const fullBags = Math.floor(total / bagSize);

        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 60) {
                if (diff > 0) nextSlide();
                else prevSlide();
            }
        }, { passive: true });

        window.onload = function () {
            updateView();
        };
    </script>
</body>
</html>
