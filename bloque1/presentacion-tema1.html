    <!-- Modal de Índice de las 15 Diapositivas -->
    <div id="index-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">

                </div>
                <button onclick="toggleIndexModal()" class="w-8 h-8 rounded-lg bg-slate-200/70 hover:bg-slate-300/70 flex items-center justify-center text-slate-600">

                <!-- Tarjetas de diapositivas -->
            </div>

    <script>
        let currentSlide = 0;
        const totalSlides = 15;
        let showDeepNotes = true;

        // Estado interactivo de cada laboratorio
        const state = {
            slide2X: 4,
            slide3WrongMode: false,
            slide4Tab: 'conmutativa',
            slide5X: 2,
            slide6Subtracted: false,
            slide7Step: 3,
            slide8CppX: 5,
            slide9QuizIndex: 0,
            slide9Feedback: null,
            slide10P: true,
            slide10Q: true,
            slide11P: true,
            slide11Q: false,
            slide12Tab: 'condicional',
            slide13Fixed: { 0: false, 1: false, 2: false, 3: false },
            slide14Pillar: 'variables',
            slide15SimX: 5,
            slide15AnswerShown: true
        };

        // Las 15 diapositivas exactas del archivo Clase1_Algebra_y_logica.pptx
        const slidesMeta = [
            { num: 1, title: "Álgebra y lógica", subtitle: "Tema 1 · Bloque 1 · Variables, propiedades, ecuaciones y condicionales", icon: "fa-scale-balanced" },
            { num: 2, title: "Variables: cajas con nombre", subtitle: "Una letra guarda un número que puede cambiar", icon: "fa-box-open" },
            { num: 3, title: "Orden de operaciones", subtitle: "Primero se multiplica, después se suma", icon: "fa-arrow-down-1-9" },
            { num: 4, title: "Propiedades para simplificar", subtitle: "Cambian la forma de escribir, no el valor", icon: "fa-sliders" },
            { num: 5, title: "La distributiva en acción", subtitle: "El número de afuera multiplica a cada término de adentro", icon: "fa-arrows-split-up-and-left" },
            { num: 6, title: "Una ecuación es una balanza", subtitle: "Lo que haces de un lado, lo haces del otro", icon: "fa-scale-balanced" },
            { num: 7, title: "Resolver paso a paso", subtitle: "Ejemplo: x + 5 = 12", icon: "fa-shoe-prints" },
            { num: 8, title: "Igualdad y asignación", subtitle: "El mismo signo \"=\" significa cosas distintas. En C++, comparar se escribe ==.", icon: "fa-code" },
            { num: 9, title: "Proposiciones: verdadero o falso", subtitle: "Una proposición tiene un valor de verdad", icon: "fa-circle-check" },
            { num: 10, title: "Y, O y NO", subtitle: "Tablas de verdad (V = verdadero, F = falso)", icon: "fa-table" },
            { num: 11, title: "Si p, entonces q", subtitle: "Solo es falso cuando p es verdadero y q es falso", icon: "fa-circle-question" },
            { num: 12, title: "Negación de un condicional", subtitle: "Se niega con \"Y\", no con \"si no\"", icon: "fa-ban" },
            { num: 13, title: "Errores frecuentes", subtitle: "Revísalos antes del examen", icon: "fa-triangle-exclamation" },
            { num: 14, title: "Resumen de la clase", subtitle: "Variables, Propiedades, Ecuaciones y Lógica", icon: "fa-cubes" },
            { num: 15, title: "¿Qué diferencia hay?", subtitle: "x = 5 en matemáticas · x = x + 1 en programación", icon: "fa-lightbulb" }
        ];

        // Componente reutilizable para las explicaciones profundizadas con tonos suaves
        function renderDeepExplanation(title, mathExplanation, cppConnection) {
            if (!showDeepNotes) return '';
            return `
                <div class="mt-4 p-4 sm:p-5 rounded-2xl bg-amber-50/70 border border-amber-200/80 text-slate-700 shadow-sm transition-all">
                    <div class="flex items-center gap-2 text-amber-800 font-bold text-xs sm:text-sm tracking-wide mb-2">
                        <i class="fa-solid fa-graduation-cap text-amber-600 text-base"></i>
                        <span>Para saber más... · ${title}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs sm:text-sm leading-relaxed">
                        <div class="bg-white/80 p-3.5 rounded-xl border border-amber-100">
                            <span class="font-bold text-slate-800 block mb-1"><i class="fa-solid fa-square-root-variable text-sky-600 mr-1.5"></i>¿Por qué funciona así en Matemáticas?</span>
                            <p class="text-slate-600">${mathExplanation}</p>
                        </div>
                        <div class="bg-white/80 p-3.5 rounded-xl border border-amber-100">
                            <span class="font-bold text-slate-800 block mb-1"><i class="fa-solid fa-terminal text-teal-600 mr-1.5"></i>Conexión con Programación Competitiva (C++)</span>
                            <p class="text-slate-600">${cppConnection}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSlideContent(index) {
            switch (index) {
                // DIAPOSITIVA 1: Portada
                case 0:
                    return `
                        <div class="slide-enter flex-1 flex flex-col items-center justify-center text-center py-4">
                            <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl bg-gradient-to-br from-sky-100 via-teal-50 to-indigo-100 border border-sky-200 flex items-center justify-center mb-5 shadow-md shadow-sky-100">
                                <i class="fa-solid fa-scale-balanced text-4xl sm:text-5xl text-sky-700"></i>
                            </div>
                            <span class="px-3.5 py-1 rounded-full text-xs font-mono uppercase tracking-widest bg-sky-50 text-sky-700 border border-sky-200 mb-3 font-semibold">
                                Club de programación Competitiva - BugSquad 2026
                            </span>
                            <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-slate-800 mb-3">
                                Álgebra y lógica
                            </h1>
                            <p class="text-base sm:text-xl text-slate-600 max-w-2xl font-medium mb-6">
                                Tema 1 · Bloque 1 · Variables, propiedades, ecuaciones y condicionales
                            </p>

                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full max-w-3xl mb-6 text-left">
                                <button onclick="goToSlide(1)" class="p-3.5 rounded-2xl bg-sky-50/70 hover:bg-sky-100/80 border border-sky-200/80 flex flex-col gap-1.5 transition group">
                                    <div class="flex items-center justify-between">
                                        <i class="fa-solid fa-cubes text-sky-600 text-lg"></i>
                                        <span class="text-[11px] font-mono text-sky-700">Diap. 2-3</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-800">Variables y Orden</span>
                                    <span class="text-[11px] text-slate-500">Sustitución y jerarquía operacional</span>
                                </button>
                                <button onclick="goToSlide(3)" class="p-3.5 rounded-2xl bg-purple-50/70 hover:bg-purple-100/80 border border-purple-200/80 flex flex-col gap-1.5 transition group">
                                    <div class="flex items-center justify-between">
                                        <i class="fa-solid fa-layer-group text-purple-600 text-lg"></i>
                                        <span class="text-[11px] font-mono text-purple-700">Diap. 4-5</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-800">Propiedades</span>
                                    <span class="text-[11px] text-slate-500">Conmutativa, asociativa y distributiva</span>
                                </button>
                                <button onclick="goToSlide(5)" class="p-3.5 rounded-2xl bg-emerald-50/70 hover:bg-emerald-100/80 border border-emerald-200/80 flex flex-col gap-1.5 transition group">
                                    <div class="flex items-center justify-between">
                                        <i class="fa-solid fa-scale-balanced text-emerald-600 text-lg"></i>
                                        <span class="text-[11px] font-mono text-emerald-700">Diap. 6-8</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-800">Ecuaciones y C++</span>
                                    <span class="text-[11px] text-slate-500">Despeje, balanza e igualdad vs asignación</span>
                                </button>
                                <button onclick="goToSlide(8)" class="p-3.5 rounded-2xl bg-amber-50/70 hover:bg-amber-100/80 border border-amber-200/80 flex flex-col gap-1.5 transition group">
                                    <div class="flex items-center justify-between">
                                        <i class="fa-solid fa-diagram-project text-amber-600 text-lg"></i>
                                        <span class="text-[11px] font-mono text-amber-700">Diap. 9-15</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-800">Lógica Formal</span>
                                    <span class="text-[11px] text-slate-500">Tablas V/F, condicionales y De Morgan</span>
                                </button>
                            </div>

                            ${renderDeepExplanation(
                                'Propósito del Bloque 1',
                                'El álgebra nos enseña a manipular cantidades desconocidas mediante reglas exactas, mientras que la lógica nos permite decidir con certeza cuándo una afirmación es verdadera o falsa.',
                                'Todo algoritmo en programación competitiva se construye sobre estos dos pilares: las variables guardan el estado del problema y las expresiones lógicas controlan el flujo mediante condicionales (if, while).'
                            )}
                        </div>
                    `;

                // DIAPOSITIVA 2: Variables: cajas con nombre
                case 1: {
                    const x = state.slide2X;
                    const res = 2 * x + 3;
                    return `
                        <div class="slide-enter flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="px-2.5 py-1 rounded-lg bg-sky-100 text-sky-800 font-mono text-xs font-bold">Diapositiva 2 de 15</span>
                                    <span class="text-xs text-slate-500 font-medium">Concepto de Variable y Evaluación</span>
                                </div>
                                <h2 class="text-2xl sm:text-4xl font-extrabold text-slate-800">Variables: cajas con nombre</h2>
                                <p class="text-slate-600 text-base sm:text-lg mt-1">Una letra guarda un número que puede cambiar</p>
                            </div>

                            <!-- Tarjetas principales del PPTX con colores pastel suaves -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 my-5">
                                <div class="p-6 rounded-2xl bg-sky-50/90 border-2 border-sky-200 flex flex-col items-center justify-center text-center shadow-sm">
                                    <span class="text-xs uppercase tracking-wider text-sky-700 font-bold mb-2">1. Nombre y Valor</span>
                                    <div class="text-4xl sm:text-5xl font-mono font-bold text-slate-800">x = ${x}</div>
                                    <span class="text-xs text-slate-500 mt-2">La caja llamada <strong>x</strong> contiene el número ${x}</span>
                                </div>
                                <div class="p-6 rounded-2xl bg-purple-50/80 border-2 border-purple-200 flex flex-col items-center justify-center text-center shadow-sm">
                                    <span class="text-xs uppercase tracking-wider text-purple-700 font-bold mb-2">2. Expresión Algebraica</span>
                                    <div class="text-4xl sm:text-5xl font-mono font-bold text-slate-800">2x + 3</div>
                                    <span class="text-xs font-mono text-purple-800 mt-2 bg-white px-2.5 py-0.5 rounded border border-purple-200">Sustitución: 2 · (${x}) + 3</span>
                                </div>
                                <div class="p-6 rounded-2xl bg-emerald-50/90 border-2 border-emerald-200 flex flex-col items-center justify-center text-center shadow-sm">
                                    <span class="text-xs uppercase tracking-wider text-emerald-700 font-bold mb-2">3. Valor Resultante</span>
                                    <div class="text-4xl sm:text-5xl font-mono font-bold text-emerald-700">${res}</div>
                                    <span class="text-xs text-emerald-800 mt-2">Porque ${2 * x} + 3 = ${res}</span>
                                </div>
                            </div>

                            <!-- Simulador interactivo -->
                            <div class="p-4 sm:p-5 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col gap-3">
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                    <p class="text-sm sm:text-base font-medium text-slate-700">
                                        <i class="fa-solid fa-Sliders text-sky-600 mr-2"></i>
                                        Con <span class="font-mono text-sky-700 font-bold">x = ${x}</span>: 
                                        <span class="font-mono bg-white px-2.5 py-1 rounded border border-slate-200 text-slate-800">2 · ${x} + 3 = ${res}</span>. 
                                        Si cambia <span class="font-mono font-bold">x</span>, cambia el resultado.
                                    </p>
                                    <button onclick="state.slide2X = 4; updateView();" class="self-start sm:self-auto text-xs px-3 py-1.5 rounded-lg bg-white hover:bg-slate-100 text-sky-700 font-mono border border-slate-300 transition shadow-sm">
                                        Restaurar x = 4
                                    </button>
                                </div>
                                <div class="flex items-center gap-4">
                                    <span class="text-xs font-mono text-slate-500">Desliza para cambiar x:</span>
                                    <input type="range" min="-5" max="15" value="${x}" oninput="state.slide2X = parseInt(this.value); updateView();" class="w-full accent-sky-600 cursor-pointer h-2 bg-slate-200 rounded-lg">
                                    <span class="font-mono text-sm font-bold text-sky-700 w-14 text-right">x = ${x}</span>
                                </div>
                            </div>

                            ${renderDeepExplanation(
                                'Notación Implícita y Evaluación',
                                'En álgebra, cuando escribimos "2x" sin ningún símbolo en medio, existe una multiplicación implícita: significa "2 multiplicado por el contenido de x". Evaluar o sustituir consiste en reemplazar la letra por su valor numérico actual antes de calcular.',
                                'En C++ cada caja tiene además un tipo de dato (por ejemplo, int x = 4;) y la multiplicación nunca es implícita: siempre debes escribir el asterisco explícitamente como 2 * x + 3.'
                            )}
                        </div>
                    `;
                }

                // DIAPOSITIVA 3: Orden de operaciones
                case 2: {
                    const isWrong = state.slide3WrongMode;
                    return `
                        <div class="slide-enter flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="px-2.5 py-1 rounded-lg bg-sky-100 text-sky-800 font-mono text-xs font-bold">Diapositiva 3 de 15</span>
                                    <span class="text-xs text-slate-500 font-medium">Jerarquía de Operadores</span>
                                </div>
                                <h2 class="text-2xl sm:text-4xl font-extrabold text-slate-800">Orden de operaciones</h2>
                                <p class="text-slate-600 text-base sm:text-lg mt-1">Primero se multiplica, después se suma</p>
                            </div>

                            <!-- Jerarquía de operaciones destacada -->
                            <div class="my-4 p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-wrap items-center justify-center gap-2 sm:gap-3 text-xs sm:text-sm font-semibold">

        }

        function goToSlide(index) {
            if (index >= 0 && index < totalSlides) {
                currentSlide = index;
                updateView();
            }
        }

        function toggleIndexModal() {
            const modal = document.getElementById('index-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        function toggleFullScreen() {
            const icon = document.getElementById('fullscreen-icon');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                icon.classList.replace('fa-expand', 'fa-compress');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    icon.classList.replace('fa-compress', 'fa-expand');
                }
            }
        }

        // Navegación con teclado (flechas izquierda/derecha)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'Escape') {
                const modal = document.getElementById('index-modal');
                if (!modal.classList.contains('hidden')) toggleIndexModal();
            }
        });

        // Soporte para gestos táctiles (swipe en móviles/tablets)
        let touchStartX = 0;
        let touchEndX = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 60) {
                if (diff > 0) nextSlide();
                else prevSlide();
            }
        }, { passive: true });

        window.onload = function () {
            updateView();
        };
    </script>
</body>
</html>
